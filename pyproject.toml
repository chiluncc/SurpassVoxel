[project]
name = "surpassvoxel"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "chiluncc", email = "1431530893@qq.com" }
]
requires-python = ">=3.13"
dependencies = [
    "jsonlines>=4.0.0",
    "langchain>=1.4.2",
    "langchain-openai>=1.6.6",
    "langgraph>=1.2.12",
    "numpy>=2.5.3",
    "orjson>=3.12.0",
    "pandas>=3.0.6",
    "pillow>=12.3.0",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
]

[project.scripts]
surpassvoxel = "surpassvoxel:main"

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[[tool.uv.index]]
name = "nju"
url = "https://mirror.nju.edu.cn/pypi/web/simple"
default = true
